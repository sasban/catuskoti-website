<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank you – Catuṣkoṭi</title>
  <meta http-equiv="refresh" content="6; url=./">
  <link rel="shortcut icon" href="Images/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; background: #F4F4F2; color: #161616; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    h1 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 2.8rem; margin-bottom: 1rem; }
    a { color: #EB4709; }
  </style>
  <!-- Google Analytics (GA4). Counts visits, plus WhatsApp taps, email clicks and form sends as enquiries. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1196EZBQGN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-1196EZBQGN');
    gtag('event', 'generate_lead', {method: 'contact_form'});
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var h = a.getAttribute('href') || '';
      if (/^https?:\/\/(wa\.me|api\.whatsapp\.com)\//i.test(h)) gtag('event', 'whatsapp_click', {link_url: h, transport_type: 'beacon'});
      else if (/^mailto:/i.test(h)) gtag('event', 'email_click', {link_url: h, transport_type: 'beacon'});
    });
  </script>
</head>
<body>
  <main>
    <h1>Thank you — we've received your message.</h1>
    <p>We'll get back to you soon. Taking you back to <a href="./">catuskoti.com</a>…</p>
  </main>
</body>
</html>
